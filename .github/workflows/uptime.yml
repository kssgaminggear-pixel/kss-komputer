name: Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check production health
        id: health
        run: |
          set -euo pipefail
          url="https://www.kssgo.com/api/health"
          last_code="000"
          for attempt in 1 2 3; do
            last_code=$(curl -sS -o health.json -w '%{http_code}' --max-time 15 "$url" || echo "000")
            echo "Attempt $attempt: HTTP $last_code"
            if [ "$last_code" = "200" ]; then
              cat health.json
              exit 0
            fi
            sleep 15
          done
          echo "Health check gagal (HTTP $last_code)"
          cat health.json || true
          exit 1

      - name: Open or update incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "[uptime]"`;
            const { data } = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 5 });
            const body = [
              'Health check production gagal.',
              '',
              '- Endpoint: https://www.kssgo.com/api/health',
              `- Waktu: ${new Date().toISOString()}`,
              `- Run: ${runUrl}`,
            ].join('\n');

            if (data.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: data.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[uptime] kssgo.com tidak sehat',
                body,
              });
            }

      - name: Close incident after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "[uptime]"`;
            const { data } = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 10 });
            for (const issue of data.items) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Pemulihan terdeteksi pada ${new Date().toISOString()}. Health check kembali HTTP 200.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
